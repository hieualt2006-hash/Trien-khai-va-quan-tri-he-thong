user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================
    # HARDENING: HIDE NGINX VERSION
    # ========================================================
    server_tokens off;

    # ========================================================
    # STRUCTURED JSON ACCESS LOG FOR LOKI / PROMTAIL
    # ========================================================
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # ========================================================
    # HARDENING: RATE LIMITING (Prevent DDoS & brute force)
    # ========================================================
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream Backend Web
    upstream backend_app {
        server app:3000;
        keepalive 32;
    }

    # Upstream phpMyAdmin
    upstream backend_pma {
        server phpmyadmin:80;
    }

    # ========================================================
    # 1. HTTP SERVER (PORT 80)
    # Redirects HTTP traffic to HTTPS (Port 443)
    # ========================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Allow basic ACME or redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================
    # 2. HTTPS SERVER (PORT 443) - MAIN SECURED REVERSE PROXY
    # ========================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL Protocols & Ciphers (Hardening)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ========================================================
        # HARDENING: SECURITY HEADERS
        # ========================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Client body limit
        client_max_body_size 15M;

        # ----------------------------------------------------
        # Reverse Proxy: Main News Portal Web App
        # ----------------------------------------------------
        location / {
            # Apply rate limiting
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            limit_conn conn_limit_per_ip 20;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------
        # Reverse Proxy: phpMyAdmin (/pma/)
        # ----------------------------------------------------
        location /pma/ {
            rewrite ^/pma/(.*)$ /$1 break;
            proxy_pass http://backend_pma;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # Nginx Basic Health / Stub Status (cho Prometheus)
        # ----------------------------------------------------
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            # In Docker container networks, allow internal monitoring
        }
    }
}
