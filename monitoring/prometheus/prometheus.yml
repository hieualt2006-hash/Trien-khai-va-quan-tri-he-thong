global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. News Portal Node.js Web Application Custom Metrics (/metrics)
  - job_name: 'news_portal_app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'news-portal-app'
          env: 'production'

  # 3. MySQL Database Exporter
  - job_name: 'mysqld_exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          service: 'mysql-database'

  # 4. cAdvisor (Container Resource Usage: CPU, RAM, Network)
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'container-engine'

  # 5. Node Exporter (Host System Metrics)
  - job_name: 'node_exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host-os'
