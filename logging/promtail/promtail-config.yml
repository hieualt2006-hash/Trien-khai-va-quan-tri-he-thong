server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape Nginx Access Logs
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            client_ip: client_ip
            request_method: request_method
            request_uri: request_uri
            status: status
            request_time: request_time
      - labels:
          status:
          request_method:

  # 2. Scrape News Portal App Logs
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: news-portal-app
          service: backend
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            method: method
            url: url
            status: status
      - labels:
          level:
          status:
